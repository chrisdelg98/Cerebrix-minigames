<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="description" content="Minijuegos de concentración: Sudoku, Buscaminas y más." />
    <meta name="theme-color" content="#0E1119" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cerebrix</title>

    <!--
      Anti-FOUC: the theme must be on <html> before the first paint, otherwise
      the page flashes the default theme on load. See docs/DESIGN_SYSTEM.md §2.3.
      This runs blocking and on purpose — it is a handful of bytes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cerebrix:theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;

          if (localStorage.getItem('cerebrix:motion') === 'reduced') {
            document.documentElement.dataset.motion = 'reduced';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
